<!DOCTYPE html>
<html>
<head>
    <title>副業ブースト</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f8f9fa;
        }
        .section {
            padding: 80px 20px;
            text-align: center;
        }
        .dark {
            background: #111;
            color: white;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto 20px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            background: #000;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
        }
        .price {
            font-size: 30px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="section dark">
    <h1>副業で人生を変える</h1>
    <p>「何から始めればいいかわからない」から卒業しませんか？</p>
    <a href="/subscribe/" class="btn">今すぐ始める</a>
</div>

<div class="section">
    <h2>こんな悩みありませんか？</h2>
    <p>✔ 副業を始めたいけど迷っている</p>
    <p>✔ 情報が多すぎて何を信じればいいかわからない</p>
    <p>✔ 続かない・結果が出ない</p>
</div>

<div class="section dark">
    <h2>副業ブーストが解決します</h2>
    <p>最短ルートだけを提示する実践型サブスク。</p>
    <p>ロードマップ・テンプレ・実践サポート付き。</p>
    <div class="price">月額 980円</div>
    <a href="/subscribe/" class="btn">今すぐ参加する</a>
</div>

</body>
</html>
